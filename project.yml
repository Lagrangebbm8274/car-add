name: CarPlistEditor
options:
  bundleIdPrefix: com.lagtools
  deploymentTarget:
    iOS: "16.0"
targets:
  CarPlistEditor:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lagtools.carplisteditor
        PRODUCT_NAME: CarPlistEditor
        INFOPLIST_KEY_CFBundleDisplayName: Car Plist Editor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO
