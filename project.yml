name: HashiriyaChinaHelper
options:
  bundleIdPrefix: com.lagtools
  deploymentTarget:
    iOS: "16.0"
targets:
  HashiriyaChinaHelper:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lagtools.hashiriyachinahelper
        PRODUCT_NAME: HashiriyaChinaHelper
        INFOPLIST_KEY_CFBundleDisplayName: "hashiriya（china） helper"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
