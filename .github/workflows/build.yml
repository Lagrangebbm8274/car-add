name: Build Hashiriya China Helper IPA
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      # 1. 下载仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. 安装 XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen
      # 3. 生成 Xcode 项目
      - name: Generate Xcode project
        run: xcodegen generate
      # 4. 编译 iOS 程序，并保存完整日志
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project HashiriyaChinaHelper.xcodeproj \
            -scheme HashiriyaChinaHelper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resultBundlePath build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      # 5. 上传构建诊断文件（即使编译失败也上传）
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            build.log
            build.xcresult
          if-no-files-found: ignore
      # 6. 打包 IPA
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HashiriyaChinaHelper.app Payload/
          /usr/bin/zip -r HashiriyaChinaHelper.ipa Payload
      # 7. 上传 IPA
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashiriyaChinaHelper-IPA
          path: HashiriyaChinaHelper.ipa
          if-no-files-found: error
