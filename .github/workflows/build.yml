name: Build Hashiriya China Helper IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app
        run: |
          xcodebuild \
            -project HashiriyaChinaHelper.xcodeproj \
            -scheme HashiriyaChinaHelper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HashiriyaChinaHelper.app Payload/
          /usr/bin/zip -r HashiriyaChinaHelper.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashiriyaChinaHelper-IPA
          path: HashiriyaChinaHelper.ipa
          if-no-files-found: error
